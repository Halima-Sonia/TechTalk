<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | TechTalk</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7ff, #eef2ff);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            width: 100%;
            max-width: 430px;

            background: #ffffff;
            padding: 40px;

            border-radius: 20px;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #6f42c1;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .form-control:focus {
            border-color: #6f42c1;

            box-shadow:
                0 0 0 0.2rem rgba(111, 66, 193, 0.15);
        }

        .login-btn {
            height: 48px;

            border: none;
            border-radius: 10px;

            background: #6f42c1;

            font-weight: 600;
        }

        .login-btn:hover {
            background: #5a32a3;
        }

        .signup-link {
            color: #6f42c1;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="login-card mx-auto">

        <!-- Heading -->
        <div class="text-center mb-4">

            <div class="logo">
                TechTalk
            </div>

            <h2 class="mt-2 mb-1">
                Welcome Back
            </h2>

            <p class="subtitle mb-0">
                Login to continue to your account
            </p>

        </div>


        <!-- Error Message -->
        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-danger">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}


        <!-- Login Form -->
        <form method="POST">

            {% csrf_token %}


            <!-- Username -->
            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="btn btn-primary login-btn w-100"
            >
                Login
            </button>

        </form>


        <!-- Signup Link -->
        <div class="text-center mt-4">

            <span class="text-muted">
                Don't have an account?
            </span>

            <a
                href="{% url 'signup' %}"
                class="signup-link"
            >
                Create an account
            </a>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
